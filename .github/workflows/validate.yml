name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install shellcheck, jq and PyYAML
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck jq
          pip install pyyaml
      - name: Run checks
        run: scripts/validate.sh
